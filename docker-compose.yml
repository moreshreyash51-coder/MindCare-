services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mindcare-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - JWT_SECRET=mindcare_local_secret_key_2026
      # Uncomment if connecting to the local MongoDB service below:
      # - MONGODB_URI=mongodb://mongo:27017/mindcare
      # Optional Gemini API Key for AI Voice & Camera features:
      # - GEMINI_API_KEY=your_gemini_api_key
    restart: unless-stopped

  # Optional MongoDB service (MindCare already includes built-in in-memory fallback if disabled)
  # mongo:
  #   image: mongo:7-jammy
  #   container_name: mindcare-mongo
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - mongo-data:/data/db
  #   restart: unless-stopped

